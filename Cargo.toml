[package]
name = "stewsh"
version = "0.3.0"
edition = "2021"
description = "StewardShell: a local, on-demand attention queue over your terminal panes and agent sessions"
license = "MIT"
repository = "https://github.com/mscottnelson/stewsh"
readme = "README.md"
keywords = ["terminal", "triage", "productivity", "shell", "sqlite"]
categories = ["command-line-utilities"]
include = ["src/**", "src/web/**", "tests/**", "shell/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
sha2 = "0.10"
dirs = "5.0"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
chrono = "0.4"
