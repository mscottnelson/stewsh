name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked
  static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - run: |
          file target/x86_64-unknown-linux-musl/release/stewsh
          ! readelf -l target/x86_64-unknown-linux-musl/release/stewsh | grep INTERP
          target/x86_64-unknown-linux-musl/release/stewsh --version
      - uses: actions/upload-artifact@v4
        with:
          name: stewsh-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/stewsh
